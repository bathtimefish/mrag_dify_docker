name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Unit tests
        run: pytest
      - name: Python lint
        run: ruff check batch mrag scripts tests
      - name: Shell lint
        run: shellcheck scripts/*.sh batch/*.sh mrag/*.sh
      - name: Prepare pinned Dify source
        run: ./scripts/bootstrap-vendors.sh
      - name: Generate CI environment
        run: ./scripts/init-env.sh
      - name: Validate release metadata and Compose locks
        run: ./scripts/verify-release.sh

  powershell-syntax:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem win-scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
