name: Container Build and Security

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * 6"
  push:
    tags: ["v*"]

permissions:
  contents: read
  security-events: write

jobs:
  build-sbom-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Build custom images
        run: ./scripts/build.sh
      - name: Generate runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: local/mrag-runtime:1.0.0
          artifact-name: mrag-runtime-1.0.0.spdx.json
          format: spdx-json
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/mrag-runtime:1.0.0
          format: sarif
          output: trivy-runtime.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@eb3cef721752a3421fe144a742539281bdf4df1a # v3
        if: always()
        with:
          sarif_file: trivy-runtime.sarif
