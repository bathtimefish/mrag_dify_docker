name: Container Build and Security

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * 6"
  push:
    tags: ["v*"]

permissions:
  contents: read
  security-events: write

jobs:
  build-sbom-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Build custom images
        run: ./scripts/build.sh
      - name: Generate runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/mrag-runtime:1.0.0
          artifact-name: mrag-runtime-1.0.0.spdx.json
          format: spdx-json
          upload-release-assets: false
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/mrag-runtime:1.0.0
          format: sarif
          output: trivy-runtime.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: ${{ always() && hashFiles('trivy-runtime.sarif') != '' }}
        with:
          sarif_file: trivy-runtime.sarif
